name: Build Windows exe

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    paths:
      - "beer_optimizer.py"
      - "beer_optimizer_gui.py"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build BeerOptimizer.exe
        run: pyinstaller --onefile --windowed --name BeerOptimizer beer_optimizer_gui.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeerOptimizer-exe
          path: dist/BeerOptimizer.exe
